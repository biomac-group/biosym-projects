# MyoFullBody (MyoHub myo_sim) for biosym, written by scripts/make_model.py -- do not edit, rerun the script.
#   * myofullbody.xml: body tree of the MJCF with jointless bodies merged, y up, joint couplings as <equality>
#   * myofullbody_muscles.xml: 416 MuJoCo muscles (rigid tendon) with polynomial paths fitted to the MuJoCo tendons
#   * contact_implicit.xml: spheres approximating the foot geometry, implicit Hunt-Crossley (SIPP law)
#   * joints: toolbox passive joint model (K1 1 N m/rad, B 1 N m s/rad, quadratic walls 5000 N m/rad^2 outside the
#     MuJoCo ranges), toes: Falisse et al. 2022 spring (25 N m/rad, 2 N m s/rad, no wall)
#     changed per joint (model_config.passive_overrides): flexion_r {'spring_stiffness': 20.0}, flexion_l {'spring_stiffness': 20.0}, deviation_r {'spring_stiffness': 20.0}, deviation_l {'spring_stiffness': 20.0}
model:
  name: myofullbody.xml
  additional_parameters:
    ground_contact:
      replace_existing: true
      file: contact_implicit.xml
    actuators:
      replace_existing: true
      file: myofullbody_muscles.xml
      activation_dynamics: true      # MuJoCo's activation dynamics with an excitation state per muscle
    visuals:
      file: visuals.npz              # meshes and muscle lines for the viewer (scripts/make_visuals.py)
    joints:
      flex_extension:
        damping: 1
        spring_stiffness: 1
