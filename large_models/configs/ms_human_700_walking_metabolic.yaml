# Metabolic half-cycle walking of MS-Human-700 at 1.3 m/s, started from its effort-objective walking solution.
# Paths are relative to the project folder (run.py changes into it).
collocation:
  name: ms_human_700_walking_metabolic
  description: >
    As 3d_simulations' metabolic walking (log cost of transport of the smooth Bhargava model, learned state prior,
    heel-strike variance penalty), warm-started from the effort solution. The arms and hands are muscle driven and are
    part of the metabolic cost.
  settings:
    model: models/ms_human_700/ms_human_700.yaml
    nnodes: 50
    discretization:
      type: euler                     # backward Euler on q; the speed constraint uses pelvis_tx (both defaults)
      args:
        weight: 10                    # scales the continuity and speed constraints (default 1)
    output:
      file: results/ms_human_700/walking_metabolic_v1.30_seed1.pkl
    enable_logging: true              # iteration logger with the live dashboard (http://localhost:8050)
    iteration_log_interval: 25
    dashboard_port: 8054
    tol: 1e-3
    acceptable_tol: 1e-3
    acceptable_dual_inf_tol: 1e-3
    dual_inf_tol: 1e-3
    constr_viol_tol: 1e-4
    max_iter: 10000

  objectives:
    - name: cot
      weight: 1
      args:
        exponent: log
    - name: objectives/prior_map.py        # state_prior_term with the MS-Human -> gait3d coordinate map
      weight: 1
      args:
        thorax: thoracic12
    - name: heelstrike_variance_term
      weight: 100
      args:
        force_threshold: 0.05
        std_limit: 0.03

  constraints:
    - name: dynamics
    - name: periodicity
      args:
        symmetry: true                # half cycle: the last node is the mirror image of the first
        mirror_negate: [pelvis_rotation, pelvis_list, pelvis_tz, L5_S1_LB, L5_S1_AR, T12_L1_LB, T12_L1_AR,
                        T1_head_neck_LB, T1_head_neck_AR]
        exclude: [0]                  # state 0 is pelvis_tx (forward position); it advances over the half cycle

  initial_guess:
    type: from_file
    file: results/ms_human_700/walking_v1.30_seed1.pkl

  bounds:
    from_model: true
    start_at_origin: true
    dur: [0.2, 0.69]                  # paper_walking.duration_bounds(1.3)
    speed: 1.3
    coordinate_ranges_unit: deg
    coordinate_ranges:                # the range the muscle paths are fitted on (scripts/make_model.py, FIT_RANGES_DEG)
      L5_S1_FE: [-8, 29]
      elv_angle_*: [-45, 100]
      shoulder_elv_*: [0, 90]
      shoulder_rot_*: [-46, 75]
