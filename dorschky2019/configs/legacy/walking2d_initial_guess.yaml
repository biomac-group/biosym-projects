collocation:
  name: walking2d_initial_guess
  description: >
    100-node half-cycle walking solution for the dorschky2019 gait2d model.
    Tracks population-average joint angles from the biosym example data at
    1.3 m/s to produce a warm-start pickle used by the IMU tracking script.
    Solver settings (tolerances, discretisation) mirror track_imu2d.yaml.

  settings:
    #model: dorschky2019/models/gait2d.yaml
    model: dorschky2019/models/gait2d_huntcrossley.yaml
    nnodes: 100
    enable_logging: true
    iteration_log_interval: 20
    discretization:
      type: euler
      args:
        mode: backward
        vars: q
        weight: 1
        adaptive_h: false
    output:
      file: "dorschky2019/result/walking2d.pkl"
    tol: 5e-4
    acceptable_tol: 1e-3
    acceptable_dual_inf_tol: 1e-3
    constr_viol_tol: 1e-4
    max_iter: 2000

  objectives:
    - name: track_angles
      weight: 1
      args:
        presegmented: true
        presegmented_file: "example_data/gait_avg_joint_angles.mot"
        exclude:
          - pelvis_tx
          - pelvis_ty
          - ankle_angle_r
          - ankle_angle_l

    - name: effort_term
      weight: 1000
      args:
        exponent: 3
        speedweighting: true

    - name: track_grf
      weight: 1
      args:
        presegmented: true
        presegmented_file: "example_data/gait_avg_grf.mot"

  constraints:
    - name: dynamics
    - name: periodicity
      args:
        symmetry: false
        exclude: [0] # Exclude pelvis_tx: it must accumulate forward progress
                     # over the gait cycle, not return to its start value.

  initial_guess:
    type: from_file
    file: "dorschky2019/result/standing2d.pkl"

  bounds:
    from_model: true
    start_at_origin: true
    dur: [0.5, 1.3]
    speed: 1.3
