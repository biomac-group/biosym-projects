collocation:
  name: walking_ig
  description: >
    100-node half-cycle walking solution, warm-started from the participant's
    standing solution and tracking the population-average joint angles/GRF
    shipped with biosym (example_data/). This is a generic warm start (not
    subject/trial specific) used to seed the IMU-tracking stage; model path,
    initial guess, and output path are filled in per participant by
    run_experiment.py.

  settings:
    model: "{model}"
    nnodes: 100
    enable_logging: true
    iteration_log_interval: 20
    discretization:
      type: euler
      args:
        mode: backward
        vars: q
        weight: 1
        adaptive_h: false
    output:
      file: "{output}"
    tol: 5e-4
    acceptable_tol: 1e-3
    acceptable_dual_inf_tol: 1e-3
    constr_viol_tol: 1e-4
    max_iter: 4000

  objectives:
    - name: track_angles
      weight: 1
      args:
        presegmented: true
        presegmented_file: "{example_data_dir}/gait_avg_joint_angles.mot"
        exclude:
          - pelvis_tx
          - pelvis_ty
          - ankle_angle_r
          - ankle_angle_l

    - name: effort_term
      weight: 1000
      args:
        exponent: 3
        speedweighting: true

    - name: track_grf
      weight: 1
      args:
        presegmented: true
        presegmented_file: "{example_data_dir}/gait_avg_grf.mot"

  constraints:
    - name: dynamics
      weight: 1.0  # dynamics constraint self-normalizes by body weight (N) internally
    - name: periodicity
      args:
        symmetry: false
        exclude: [0] # Exclude pelvis_tx: it must accumulate forward progress
                     # over the gait cycle, not return to its start value.

  initial_guess:
    type: from_file
    file: "{initial_guess}"

  bounds:
    from_model: true
    start_at_origin: true
    dur: [0.5, 1.3]
    speed: 1.3
