collocation:
  name: P05_ig_running
  description: 100-node half-cycle running warm start, tracking a population-average
    running pattern derived from Fukuchi et al. (2017) 3.5 m/s treadmill running data
    (not subject/trial specific).
  settings:
    model: models/participants/P05.yaml
    nnodes: 100
    enable_logging: true
    iteration_log_interval: 20
    discretization:
      type: euler
      args: {mode: backward, vars: q, weight: 1, adaptive_h: false}
    output: {file: result/P05/ig_running.pkl}
    tol: 0.0005
    acceptable_tol: 0.001
    acceptable_dual_inf_tol: 0.001
    constr_viol_tol: 0.0001
    max_iter: 4000
  objectives:
  - name: track_angles
    weight: 1
    args:
      presegmented: true
      presegmented_file: data/fukuchi_running_joint_angles.mot
      exclude: [pelvis_tx, pelvis_ty, pelvis_tilt]
  - name: effort_term
    weight: 300
    args: {exponent: 3, speedweighting: true}
  - name: track_grf
    weight: 1
    args: {presegmented: true, presegmented_file: data/fukuchi_running_grf.mot}
  constraints:
  - {name: dynamics}
  - name: periodicity
    args:
      symmetry: false
      exclude: [0]
  initial_guess: {type: from_file, file: result/P05/ig_walking.pkl}
  bounds:
    from_model: true
    start_at_origin: true
    dur: [0.4, 1.0]
    speed: 3.5
